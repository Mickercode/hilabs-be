name: CI

on:
  push:
    branches: [production, staging]
  pull_request:
    branches: [production, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database invariants and e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hilabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hilabs_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hilabs_test

    steps:
      - uses: actions/checkout@v4

      - name: Apply the schema
        run: psql -v ON_ERROR_STOP=1 -q -f db/schema.sql

      # The research design lives in the triggers and CHECKs, not only in the tables. This step
      # fails the build if a migration has quietly dropped one.
      - name: Run the invariant tests
        run: psql -v ON_ERROR_STOP=1 -q -f db/test_schema.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # The catalogue is the instrument: without it, Discovery has nothing to offer. Seeding here
      # also checks that it still covers all six GIM domains, and fails the build if it does not.
      - run: npm run db:seed

      # End-to-end against a real database, because most of what this API guarantees is enforced
      # by the database rather than by application code.
      - run: npm run test:e2e

  app:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, and the types are needed to compile.
      # It reads prisma/schema.prisma and needs no database.
      - run: npx prisma generate

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
