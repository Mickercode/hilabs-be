name: CI

on:
  push:
    branches: [production, staging]
  pull_request:
    branches: [production, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hilabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hilabs_test

    steps:
      - uses: actions/checkout@v4

      - name: Apply the schema
        run: psql -v ON_ERROR_STOP=1 -q -f db/schema.sql

      # The research design lives in the triggers and CHECKs, not only in the tables. This step
      # fails the build if a migration has quietly dropped one.
      - name: Run the invariant tests
        run: psql -v ON_ERROR_STOP=1 -q -f db/test_schema.sql

  app:
    name: Lint, types, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test -- --passWithNoTests
